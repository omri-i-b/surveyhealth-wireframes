<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tickets — Providence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { font-size: 13px; }
    tbody td { white-space: nowrap; }
    thead th { white-space: nowrap; }
    .severity-high { border-left: 3px solid #ef4444; }
    .severity-medium { border-left: 3px solid #f59e0b; }
    .severity-low { border-left: 3px solid #3b82f6; }
    .severity-none { border-left: 3px solid transparent; }
    .row-actions { opacity: 0; transition: opacity 0.1s; }
    tr:hover .row-actions { opacity: 1; }
    .demo-row { background: linear-gradient(to right, rgba(6,182,212,0.04), transparent 50%); }
  </style>
</head>
<body class="bg-gray-50 text-gray-900">

  <div class="flex h-screen">

    <!-- Left Sidebar (copied verbatim from /tickets/) -->
    <div class="w-48 bg-white border-r border-gray-200 flex flex-col flex-shrink-0">
      <div class="p-3 border-b border-gray-200 flex items-center gap-2">
        <div class="w-8 h-8 bg-orange-500 rounded-lg flex items-center justify-center text-white text-xs font-bold">PF</div>
        <span class="text-sm font-semibold text-gray-900 truncate">Providence Fa...</span>
        <svg class="w-3 h-3 text-gray-400 ml-auto flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l4-4 4 4m0 6l-4 4-4-4"/></svg>
      </div>
      <nav class="flex-1 p-2 space-y-0.5">
        <a href="#" class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-blue-700 bg-blue-50 rounded">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/></svg>
          Tickets
        </a>
        <a href="#" class="flex items-center gap-2 px-3 py-2 text-sm text-gray-600 hover:bg-gray-50 rounded">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          Patients
        </a>
        <a href="../reports/daily/" class="flex items-center gap-2 px-3 py-2 text-sm text-gray-600 hover:bg-gray-50 rounded">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
          Daily Report
        </a>
        <a href="#" class="flex items-center gap-2 px-3 py-2 text-sm text-gray-600 hover:bg-gray-50 rounded">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          Adhoc
        </a>
        <a href="#" class="flex items-center gap-2 px-3 py-2 text-sm text-gray-600 hover:bg-gray-50 rounded">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          Settings
        </a>
      </nav>
      <div class="border-t border-gray-200 p-2">
        <div class="text-[10px] text-gray-400 uppercase tracking-wide px-3 py-1">Admin</div>
        <a href="#" class="flex items-center gap-2 px-3 py-2 text-sm text-gray-600 hover:bg-gray-50 rounded">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
          All Workspaces
        </a>
        <a href="#" class="flex items-center gap-2 px-3 py-2 text-sm text-gray-600 hover:bg-gray-50 rounded">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          All Users
        </a>
        <a href="#" class="flex items-center gap-2 px-3 py-2 text-sm text-gray-600 hover:bg-gray-50 rounded">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/></svg>
          Campaigns
        </a>
      </div>
      <div class="border-t border-gray-200 p-3 flex items-center gap-2">
        <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center text-blue-700 text-xs font-semibold">LG</div>
        <div class="flex-1 min-w-0">
          <div class="text-sm font-medium text-gray-900 truncate">Lisa Goldenstein</div>
          <div class="text-[10px] text-gray-500">Care Manager</div>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">

      <!-- Header: Title + Glanceable Stats + Action -->
      <div class="px-6 py-4 border-b border-gray-200 bg-white">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-6">
            <h1 class="text-xl font-semibold text-gray-900">Tickets</h1>
            <div id="stats-container" class="flex items-center gap-3 text-xs"></div>
          </div>
          <button class="inline-flex items-center gap-2 px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            New Ticket
          </button>
        </div>
      </div>

      <!-- Filter Bar -->
      <div class="px-6 py-2.5 bg-white border-b border-gray-200 flex items-center gap-3">
        <button class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium border border-gray-200 rounded-lg hover:bg-gray-50">
          Type: All
          <svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <button class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium border border-blue-200 bg-blue-50 text-blue-700 rounded-lg">
          Status: Open + 2
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <button class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium border border-gray-200 rounded-lg hover:bg-gray-50">
          Assignee: All
          <svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <button class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium border border-gray-200 rounded-lg hover:bg-gray-50">
          Priority
          <svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <div class="flex-1 relative ml-2">
          <svg class="w-3.5 h-3.5 text-gray-400 absolute left-2.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input type="text" placeholder="Search tickets..." class="w-full pl-8 pr-3 py-1.5 text-xs border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
        </div>
        <button class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-gray-600 border border-gray-200 rounded-lg hover:bg-gray-50">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"/></svg>
          Newest
        </button>
        <button class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-gray-600 border border-gray-200 rounded-lg hover:bg-gray-50">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          Export
        </button>
      </div>

      <!-- Table -->
      <div class="flex-1 overflow-auto">
        <table class="w-full">
          <thead class="bg-gray-50/80 border-b border-gray-200 sticky top-0 backdrop-blur-sm">
            <tr>
              <th class="w-8 px-3 py-2.5"><input type="checkbox" class="rounded border-gray-300"></th>
              <th class="px-3 py-2.5 text-left text-[11px] font-semibold text-gray-500 uppercase tracking-wider">Patient</th>
              <th class="px-3 py-2.5 text-left text-[11px] font-semibold text-gray-500 uppercase tracking-wider">Type</th>
              <th class="px-3 py-2.5 text-left text-[11px] font-semibold text-gray-500 uppercase tracking-wider">Status</th>
              <th class="px-3 py-2.5 text-left text-[11px] font-semibold text-gray-500 uppercase tracking-wider">Priority</th>
              <th class="px-3 py-2.5 text-left text-[11px] font-semibold text-gray-500 uppercase tracking-wider">Calls</th>
              <th class="px-3 py-2.5 text-left text-[11px] font-semibold text-gray-500 uppercase tracking-wider">Callback</th>
              <th class="px-3 py-2.5 text-left text-[11px] font-semibold text-gray-500 uppercase tracking-wider">Assigned</th>
              <th class="px-3 py-2.5 text-left text-[11px] font-semibold text-gray-500 uppercase tracking-wider">Assessment</th>
              <th class="px-3 py-2.5 w-28"></th>
            </tr>
          </thead>
          <tbody id="tickets-tbody" class="divide-y divide-gray-100 bg-white"></tbody>
        </table>
      </div>

      <!-- Footer -->
      <div class="px-6 py-2 bg-white border-t border-gray-200 flex items-center justify-between text-xs text-gray-500">
        <span id="footer-count">Loading...</span>
        <div class="flex items-center gap-2">
          <button class="px-2 py-1 border border-gray-200 rounded hover:bg-gray-50 text-gray-400 cursor-not-allowed" disabled>&larr; Prev</button>
          <span class="px-2 py-1 text-gray-700 font-medium">1</span>
          <button class="px-2 py-1 border border-gray-200 rounded hover:bg-gray-50">Next &rarr;</button>
        </div>
      </div>

    </div>
  </div>

<script>
// --- Icon + badge helpers ---------------------------------------------------
const ICON_PHONE = '<svg class="w-3 h-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>';
const ICON_SMS = '<svg class="w-3 h-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>';

const TYPE_PILL = {
  'Escalation':          'text-orange-700 bg-orange-100',
  'Inbound Call':        'text-teal-700 bg-teal-100',
  'Consent':             'text-blue-700 bg-blue-100',
  'Requires Attention':  'text-purple-700 bg-purple-100',
};
const STATUS_PILL = {
  'Open':        'text-blue-700 bg-blue-50 border-blue-200',
  'In Progress': 'text-amber-700 bg-amber-50 border-amber-200',
  'Pending':     'text-purple-700 bg-purple-50 border-purple-200',
};
const PRIORITY_COLOR = {
  'High':   { dot: 'bg-red-500',   text: 'text-red-600'   },
  'Medium': { dot: 'bg-amber-500', text: 'text-amber-600' },
  'Low':    { dot: 'bg-blue-500',  text: 'text-blue-600'  },
};

function pill(cls, text) {
  return `<span class="px-2 py-0.5 text-[11px] font-medium ${cls} rounded-full">${text}</span>`;
}
function statusPill(s) {
  const cls = STATUS_PILL[s] || 'text-gray-700 bg-gray-50 border-gray-200';
  return `<span class="px-2 py-0.5 text-[11px] font-medium ${cls} border rounded-full">${s}</span>`;
}
function priorityCell(p) {
  if (!p) return '<span class="text-xs text-gray-400">-</span>';
  const c = PRIORITY_COLOR[p];
  return `<div class="flex items-center gap-1.5"><span class="w-2 h-2 ${c.dot} rounded-full"></span><span class="text-xs font-medium ${c.text}">${p}</span></div>`;
}
function textOrDash(v, extra = 'text-xs text-gray-700') {
  if (v == null || v === '') return '<span class="text-xs text-gray-400">-</span>';
  return `<span class="${extra}">${v}</span>`;
}
function assigneeCell(t) {
  if (!t.assignee) return '<span class="inline-flex items-center gap-1 px-2 py-0.5 text-[11px] font-medium text-amber-700 bg-amber-50 border border-amber-200 rounded-full">Unassigned</span>';
  const color = t.assigneeColor || 'blue';
  return `<div class="flex items-center gap-1.5">
    <div class="w-5 h-5 bg-${color}-100 rounded-full flex items-center justify-center text-[9px] font-semibold text-${color}-700">${t.assigneeInitials || '??'}</div>
    <span class="text-xs text-gray-700">${t.assignee}</span>
  </div>`;
}
function severityClass(s) {
  return 'severity-' + (s || 'none');
}
function hoverBg(s) {
  if (s === 'high')   return 'hover:bg-red-50/30';
  if (s === 'medium') return 'hover:bg-amber-50/30';
  return 'hover:bg-gray-50';
}
function iconHTML(icon) {
  if (icon === 'phone') return ICON_PHONE;
  if (icon === 'sms')   return ICON_SMS;
  return '';
}
function actionsCell(t) {
  const assigned = !!t.assignee;
  const primary = assigned
    ? '<button class="px-2 py-1 text-[11px] font-medium text-gray-600 bg-gray-100 rounded hover:bg-gray-200">Snooze</button>'
    : '<button class="px-2 py-1 text-[11px] font-medium text-blue-600 bg-blue-50 rounded hover:bg-blue-100">Assign</button>';
  return `<div class="row-actions flex items-center gap-1">
    ${primary}
    <button class="px-2 py-1 text-[11px] font-medium text-green-600 bg-green-50 rounded hover:bg-green-100">Resolve</button>
    <button class="p-1 text-gray-400 rounded hover:bg-gray-100"><svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button>
  </div>`;
}
function patientCell(t) {
  const color = t.avatarColor || 'gray';
  const nameHTML = t.href
    ? `<a href="${t.href}" class="text-sm text-gray-900 hover:text-blue-700 hover:underline">${t.patient}</a>`
    : `<span class="text-sm text-gray-900">${t.patient}</span>`;
  const demoBadge = '';
  return `<div class="flex items-center gap-2">
    ${nameHTML}
    ${demoBadge}
  </div>`;
}

// --- Render -----------------------------------------------------------------
function renderStats(stats) {
  const el = document.getElementById('stats-container');
  el.innerHTML = `
    <div class="flex items-center gap-1.5 px-2.5 py-1 bg-blue-50 border border-blue-100 rounded-full">
      <span class="w-1.5 h-1.5 bg-blue-500 rounded-full"></span>
      <span class="font-semibold text-blue-700">${stats.open}</span>
      <span class="text-blue-600">Open</span>
    </div>
    <div class="flex items-center gap-1.5 px-2.5 py-1 bg-amber-50 border border-amber-100 rounded-full">
      <span class="w-1.5 h-1.5 bg-amber-500 rounded-full"></span>
      <span class="font-semibold text-amber-700">${stats.inProgress}</span>
      <span class="text-amber-600">In Progress</span>
    </div>
    <div class="flex items-center gap-1.5 px-2.5 py-1 bg-purple-50 border border-purple-100 rounded-full">
      <span class="w-1.5 h-1.5 bg-purple-500 rounded-full"></span>
      <span class="font-semibold text-purple-700">${stats.pending}</span>
      <span class="text-purple-600">Pending</span>
    </div>
    <span class="text-gray-400">|</span>
    <span class="text-gray-500 font-medium">${stats.total} total</span>`;
}

function renderTicket(t) {
  const typeCls = TYPE_PILL[t.type] || 'text-gray-700 bg-gray-100';
  const rowCls = `${hoverBg(t.severity)} cursor-pointer ${severityClass(t.severity)}`;
  // Make the whole row navigate when a href is set (e.g. Claire → call/claire/)
  const rowAttrs = t.href
    ? `class="${rowCls}" onclick="if(event.target.tagName!=='INPUT'&&event.target.tagName!=='BUTTON'&&!event.target.closest('button')){window.location='${t.href}'}"`
    : `class="${rowCls}"`;
  return `<tr ${rowAttrs}>
    <td class="px-3 py-2.5" onclick="event.stopPropagation()"><input type="checkbox" class="rounded border-gray-300"></td>
    <td class="px-3 py-2.5">${patientCell(t)}</td>
    <td class="px-3 py-2.5">${pill(typeCls, t.type)}</td>
    <td class="px-3 py-2.5">${statusPill(t.status)}</td>
    <td class="px-3 py-2.5">${priorityCell(t.priority)}</td>
    <td class="px-3 py-2.5">${textOrDash(t.calls, 'text-xs text-gray-700')}</td>
    <td class="px-3 py-2.5">${textOrDash(t.callback, 'text-xs text-gray-700')}</td>
    <td class="px-3 py-2.5">${assigneeCell(t)}</td>
    <td class="px-3 py-2.5">${textOrDash(t.assessment, 'text-xs text-gray-700')}</td>
    <td class="px-3 py-2.5">${actionsCell(t)}</td>
  </tr>`;
}

async function load() {
  try {
    const res = await fetch('../data/tickets.json', { cache: 'no-store' });
    const data = await res.json();
    renderStats(data.stats);
    const tbody = document.getElementById('tickets-tbody');
    tbody.innerHTML = data.tickets.map(renderTicket).join('');
    document.getElementById('footer-count').textContent =
      `Showing ${data.tickets.length} of ${data.stats.total} tickets`;
  } catch (err) {
    document.getElementById('tickets-tbody').innerHTML =
      `<tr><td colspan="11" class="px-6 py-12 text-center text-gray-500">
        Failed to load tickets.json — serve this page via a local web server (e.g. <code>python3 -m http.server</code>).
      </td></tr>`;
    console.error(err);
  }
}
load();
</script>

</body>
</html>
