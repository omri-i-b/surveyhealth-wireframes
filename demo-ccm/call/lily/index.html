<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lily Live Call · Survey Health</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { font-size: 13px; }
    .pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 500; }
    .dot { width: 6px; height: 6px; border-radius: 9999px; display: inline-block; }
    .pulse { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.4 } }
  </style>
</head>
<body class="bg-gray-50 text-gray-900">

<div class="flex h-screen">

  <!-- Left Sidebar (mirrors /demo-ccm/tickets/) -->
  <div class="w-48 bg-white border-r border-gray-200 flex flex-col flex-shrink-0">
    <div class="h-14 px-3 border-b border-gray-200 flex items-center gap-2 flex-shrink-0">
      <div class="w-8 h-8 bg-orange-500 rounded-lg flex items-center justify-center text-white text-xs font-bold">PF</div>
      <span class="text-sm font-semibold text-gray-900 truncate">Everyday Heal...</span>
    </div>
    <nav class="flex-1 p-2 space-y-0.5">
      <a href="../../tickets/" class="flex items-center gap-2 px-3 py-2 text-sm text-gray-600 hover:bg-gray-50 rounded">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/></svg>
        Tickets
      </a>
      <a href="#" class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-blue-700 bg-blue-50 rounded">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M17.95 6.05a8 8 0 010 11.9M8.5 12a3.5 3.5 0 117 0v0a3.5 3.5 0 11-7 0z"/></svg>
        Lily Live Call
      </a>
      <a href="../../reports/daily/" class="flex items-center gap-2 px-3 py-2 text-sm text-gray-600 hover:bg-gray-50 rounded">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/></svg>
        Daily Report
      </a>
      <a href="../../../reports/monthly/" class="flex items-center gap-2 px-3 py-2 text-sm text-gray-600 hover:bg-gray-50 rounded">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        Monthly Report
      </a>
    </nav>
    <div class="border-t border-gray-200 p-3 flex items-center gap-2">
      <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center text-blue-700 text-xs font-semibold">LG</div>
      <div class="flex-1 min-w-0">
        <div class="text-sm font-medium text-gray-900 truncate">L. Goldenstein</div>
        <div class="text-[10px] text-gray-500">Care Manager</div>
      </div>
    </div>
  </div>

  <!-- Main -->
  <div class="flex-1 bg-white flex flex-col min-w-0">
    <div class="h-14 border-b border-gray-200 flex items-center justify-between px-5 flex-shrink-0">
      <div class="flex items-center gap-3">
        <a href="../../tickets/" class="text-gray-400 hover:text-gray-600">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        </a>
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 bg-gradient-to-br from-violet-500 to-fuchsia-600 rounded-full flex items-center justify-center text-white font-bold text-[10px]">LV</div>
          <div>
            <h1 class="text-sm font-semibold text-gray-900">Lily Live Call</h1>
            <div class="text-[11px] text-gray-500">Survey Health voice agent</div>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span id="status-pill" class="pill bg-gray-100 text-gray-600"><span class="dot bg-gray-400"></span>Idle</span>
      </div>
    </div>

    <div class="flex-1 overflow-y-auto">
      <div class="max-w-3xl mx-auto px-6 py-6 space-y-6">

        <!-- Trigger card -->
        <div class="rounded-xl border border-gray-200 overflow-hidden bg-white">
          <div class="px-4 py-3 bg-gradient-to-r from-violet-50 to-fuchsia-50 border-b border-gray-200 flex items-center justify-between">
            <span class="text-sm font-semibold text-gray-900">Start a Lily call</span>
            <span class="text-[11px] text-gray-500">Outbound</span>
          </div>
          <div class="p-4 grid grid-cols-1 md:grid-cols-[1fr_1fr_180px_auto] gap-3 items-end">
            <label class="block">
              <span class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide">Patient first name</span>
              <input id="input-name" type="text" placeholder="Jane" autocomplete="off" class="mt-1 w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-violet-500">
            </label>
            <label class="block">
              <span class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide">Patient phone (E.164)</span>
              <input id="input-phone" type="tel" placeholder="+12107444981" autocomplete="off" class="mt-1 w-full px-3 py-2 text-sm font-mono border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-violet-500">
            </label>
            <label class="block">
              <span class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide">Flow</span>
              <select id="input-flow" class="mt-1 w-full px-3 py-2 text-sm border border-gray-300 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-violet-500">
                <option value="ckd_session_1">CKD · 5 questions</option>
                <option value="esrd_session_5">ESRD · 5 questions</option>
              </select>
            </label>
            <button type="button" id="start-btn" onclick="startLilyCall()" class="px-4 py-2 bg-violet-600 text-white text-sm font-semibold rounded-md hover:bg-violet-700 disabled:bg-gray-300 disabled:cursor-not-allowed flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
              <span id="start-btn-label">Start call</span>
            </button>
          </div>
          <div id="trigger-error" class="hidden px-4 pb-3 text-xs text-red-600"></div>
        </div>

        <!-- Live status bar -->
        <div id="status-card" class="hidden rounded-xl border border-gray-200 bg-white px-4 py-3 flex items-center justify-between flex-wrap gap-3">
          <div class="flex items-center gap-3">
            <span id="status-dot" class="dot bg-yellow-400 pulse" style="width:10px;height:10px;"></span>
            <div>
              <div id="status-text" class="text-sm font-medium text-gray-900">Calling patient…</div>
              <div id="status-sub" class="text-[11px] text-gray-500 font-mono">room —</div>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <a id="view-ticket-link" href="#" target="_blank" rel="noopener" class="hidden text-xs font-medium px-3 py-1.5 rounded-md border border-blue-200 bg-white text-blue-700 hover:bg-blue-50 flex items-center gap-1.5">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/></svg>
              View as ticket →
            </a>
            <button type="button" onclick="resetCall()" class="text-xs text-gray-500 hover:text-gray-700">Reset</button>
          </div>
        </div>

        <!-- Call recording card (transcript + extracted Q&A) -->
        <div id="call-card" class="hidden rounded-xl border border-gray-200 overflow-hidden bg-white">
          <div class="px-4 py-3 bg-gray-50 border-b border-gray-200 flex items-center justify-between flex-wrap gap-2">
            <span class="text-sm font-semibold text-gray-900">Call Recording</span>
            <span id="call-meta" class="text-[11px] text-gray-500"></span>
          </div>

          <!-- Transcript accordion -->
          <div>
            <button onclick="toggleTranscript()" class="w-full px-4 py-2 flex items-center justify-between bg-gray-50 hover:bg-gray-100 border-b border-gray-200">
              <span class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide">Transcript</span>
              <span id="transcript-toggle" class="text-xs text-blue-600">Show ↓</span>
            </button>
            <div id="transcript-content" class="overflow-hidden" style="max-height:0; transition: max-height 0.25s ease;">
              <div id="transcript-turns" class="p-4 space-y-2 text-sm"></div>
            </div>
          </div>

          <!-- Extracted Q&A -->
          <div class="border-t border-gray-200">
            <div class="px-4 py-3 bg-gray-50 border-b border-gray-200">
              <span class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide">Extracted Responses</span>
            </div>
            <div id="extracted-list" class="p-4 space-y-2"></div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
// =========================================================================
// Lily live-call demo — wired to Railway proxy /lily/{start,callback,calls}
// =========================================================================
const PROXY_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://localhost:8787'
  : 'https://quocallsccm-production.up.railway.app';

let pollTimer = null;
let currentRoom = null;
let transcriptExpanded = false;

function setStatus(label, color, sub) {
  const dot = document.getElementById('status-dot');
  const text = document.getElementById('status-text');
  const subEl = document.getElementById('status-sub');
  const pill = document.getElementById('status-pill');
  const card = document.getElementById('status-card');
  if (card) card.classList.remove('hidden');
  if (dot) {
    dot.className = 'dot ' + color;
    dot.style.width = '10px';
    dot.style.height = '10px';
    if (color.includes('yellow') || color.includes('violet')) dot.classList.add('pulse');
  }
  if (text) text.textContent = label;
  if (subEl && sub != null) subEl.textContent = sub;
  if (pill) {
    pill.className = 'pill ' + ({
      'bg-yellow-400': 'bg-yellow-100 text-yellow-800',
      'bg-violet-500': 'bg-violet-100 text-violet-800',
      'bg-green-500':  'bg-green-100 text-green-800',
      'bg-red-500':    'bg-red-100 text-red-800',
      'bg-gray-400':   'bg-gray-100 text-gray-600',
    }[color] || 'bg-gray-100 text-gray-600');
    pill.innerHTML = `<span class="dot ${color}"></span>${label}`;
  }
}

function showError(msg) {
  const el = document.getElementById('trigger-error');
  if (el) {
    el.textContent = msg;
    el.classList.remove('hidden');
  }
}

async function startLilyCall() {
  const btn = document.getElementById('start-btn');
  const lbl = document.getElementById('start-btn-label');
  const errEl = document.getElementById('trigger-error');
  if (errEl) errEl.classList.add('hidden');
  const name  = document.getElementById('input-name').value.trim();
  const phone = document.getElementById('input-phone').value.trim();
  const flow  = document.getElementById('input-flow').value;
  if (!name)  { showError('Enter a patient first name.'); return; }
  if (!/^\+\d{10,15}$/.test(phone)) { showError('Phone must be E.164, e.g. +12107444981.'); return; }
  btn.disabled = true;
  lbl.textContent = 'Calling…';
  setStatus('Calling patient…', 'bg-yellow-400', `flow ${flow} · dialing ${phone}`);
  try {
    const res = await fetch(PROXY_BASE + '/lily/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ flow, phone, patient_name: name }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.detail || body.error || `HTTP ${res.status}`);
    currentRoom = body.room;
    setStatus('Call in progress…', 'bg-violet-500', `room ${currentRoom}`);
    btn.disabled = true;
    lbl.textContent = 'In progress…';
    startPolling(currentRoom);
  } catch (err) {
    console.error(err);
    showError(err.message || 'Failed to start call');
    setStatus('Failed to start', 'bg-red-500', err.message || '');
    btn.disabled = false;
    lbl.textContent = 'Start call';
  }
}

function startPolling(room) {
  if (pollTimer) clearInterval(pollTimer);
  const tick = async () => {
    try {
      const res = await fetch(PROXY_BASE + '/lily/calls/' + encodeURIComponent(room), { cache: 'no-store' });
      if (!res.ok) return; // keep polling — race with callback
      const snap = await res.json();
      handleSnapshot(snap);
      if (snap.status === 'extracted' || snap.status === 'extract-failed') {
        clearInterval(pollTimer); pollTimer = null;
        document.getElementById('start-btn').disabled = false;
        document.getElementById('start-btn-label').textContent = 'Start another call';
      }
    } catch (_) { /* keep polling */ }
  };
  tick();
  pollTimer = setInterval(tick, 3000);
}

function handleSnapshot(snap) {
  // Render whatever we have at this point
  if (snap.transcript && snap.transcript.length) {
    renderCallCard(snap);
    if (snap.status === 'transcribed') {
      setStatus('Call ended · extracting Q&A…', 'bg-violet-500', `room ${snap.room}`);
    } else if (snap.status === 'extracted') {
      setStatus('Done', 'bg-green-500', `room ${snap.room}`);
    } else if (snap.status === 'extract-failed') {
      setStatus('Extract failed', 'bg-red-500', snap.error || 'unknown error');
    }
  } else if (snap.status === 'in-progress') {
    setStatus('Call in progress…', 'bg-violet-500', `room ${snap.room}`);
  }
  // Once extracted, reveal the "View as ticket" link to the demo ticket page
  const link = document.getElementById('view-ticket-link');
  if (link && snap.status === 'extracted') {
    link.href = './ticket/?room=' + encodeURIComponent(snap.room);
    link.classList.remove('hidden');
  }
}

function renderCallCard(snap) {
  const card = document.getElementById('call-card');
  if (card) card.classList.remove('hidden');
  // Meta line
  const meta = document.getElementById('call-meta');
  if (meta) {
    const dur = snap.callMeta?.duration_seconds;
    const dt  = snap.callMeta?.call_end ? new Date(snap.callMeta.call_end * 1000) : null;
    const parts = [];
    if (dur != null) parts.push(`${Math.floor(dur/60)}:${String(dur%60).padStart(2,'0')}`);
    if (dt) parts.push(dt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
    parts.push(snap.flow || '');
    parts.push(snap.patientName ? `patient ${snap.patientName}` : '');
    meta.textContent = parts.filter(Boolean).join(' · ');
  }
  // Transcript
  const turnsEl = document.getElementById('transcript-turns');
  if (turnsEl) {
    turnsEl.innerHTML = (snap.transcript || []).map(t => {
      const isAgent = t.role === 'assistant';
      const labelCls = isAgent ? 'font-medium text-violet-700' : 'font-medium text-gray-900';
      const label = isAgent ? 'Lily' : (snap.patientName || 'Patient');
      const ts = t.timestamp ? new Date(t.timestamp * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '';
      return `<div class="flex gap-3">
        <span class="text-[10px] text-gray-400 w-14 flex-shrink-0 pt-0.5 font-mono tabular-nums">${ts}</span>
        <div><span class="${labelCls}">${escapeHtml(label)}:</span> <span class="text-gray-700">${escapeHtml(t.text || '')}</span></div>
      </div>`;
    }).join('');
  }
  // Extracted Q&A
  const ext = document.getElementById('extracted-list');
  if (ext) {
    const rows = snap.extracted?.extractedResponses || [];
    if (!rows.length && snap.status === 'transcribed') {
      ext.innerHTML = `<div class="text-xs text-gray-400 text-center py-3">Extracting Q&A from transcript…</div>`;
    } else if (!rows.length) {
      ext.innerHTML = `<div class="text-xs text-gray-400 text-center py-3">No structured Q&A captured for this call.</div>`;
    } else {
      ext.innerHTML = rows.map(r => {
        const bg = r.answerClass === 'bad' ? 'bg-red-50' : r.answerClass === 'good' ? 'bg-green-50' : 'bg-yellow-50';
        const badge = r.answerClass === 'bad' ? 'bg-red-200 text-red-800' : r.answerClass === 'good' ? 'bg-green-200 text-green-800' : 'bg-yellow-200 text-yellow-800';
        return `<div class="${bg} rounded-lg p-3">
          <div class="flex items-start justify-between gap-3 mb-1.5">
            <span class="text-gray-800 font-medium text-sm">${escapeHtml(r.question)}</span>
            <span class="px-2 py-0.5 ${badge} text-xs font-semibold rounded flex-shrink-0">${escapeHtml(r.answer)}</span>
          </div>
          ${r.quote ? `<p class="text-gray-600 text-sm italic">&ldquo;${escapeHtml(r.quote)}&rdquo;</p>` : ''}
        </div>`;
      }).join('');
    }
  }
}

function toggleTranscript() {
  const content = document.getElementById('transcript-content');
  const toggle  = document.getElementById('transcript-toggle');
  transcriptExpanded = !transcriptExpanded;
  if (transcriptExpanded) {
    content.style.maxHeight = content.scrollHeight + 'px';
    toggle.textContent = 'Hide ↑';
  } else {
    content.style.maxHeight = '0';
    toggle.textContent = 'Show ↓';
  }
}

function resetCall() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  currentRoom = null;
  document.getElementById('call-card').classList.add('hidden');
  document.getElementById('status-card').classList.add('hidden');
  const link = document.getElementById('view-ticket-link');
  if (link) { link.classList.add('hidden'); link.href = '#'; }
  setStatus('Idle', 'bg-gray-400', '—');
  document.getElementById('start-btn').disabled = false;
  document.getElementById('start-btn-label').textContent = 'Start call';
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>

</body>
</html>
